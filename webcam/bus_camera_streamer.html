<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Transport - Bus Camera Streamer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #2d3748;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { margin-top: 0; color: #63b3ed; }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label { display: block; margin-bottom: 8px; color: #a0aec0; }
        input {
            width: 100%;
            padding: 12px;
            background: #1a202c;
            border: 2px solid #4a5568;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #2b6cb0; }
        button.stop { background-color: #e53e3e; }
        button.stop:hover { background-color: #c53030; }
        
        .video-container {
            margin-top: 20px;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #718096;
        }
        .dot.active { background: #48bb78; box-shadow: 0 0 8px #48bb78; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bus Camera Streamer</h1>
        <p style="color: #a0aec0; margin-bottom: 25px;">Use this website as the onboard bus camera to stream live video to passengers.</p>
        
        <div class="input-group">
            <label for="backendIp">Backend IP Address</label>
            <input type="text" id="backendIp" placeholder="e.g. 10.211.125.79" value="localhost">
            <small style="color: #a0aec0; font-size: 11px;">Enter 'localhost' if running on this machine, or your laptop's IP if accessing from elsewhere.</small>
        </div>

        <div class="input-group">
            <label for="busNumber">Bus/Cab Number</label>
            <input type="text" id="busNumber" placeholder="e.g. BUS-404" autoCapitalize="characters" value="BUS-123">
        </div>

        <button id="toggleBtn" onclick="toggleStreaming()">Start Streaming</button>

        <div class="video-container">
            <video id="preview" autoplay muted playsinline></video>
        </div>

        <div class="status">
            <div id="statusDot" class="dot"></div>
            <span id="statusText">System Idle</span>
        </div>
        
        <canvas id="captureCanvas" width="640" height="480"></canvas>
    </div>

    <script>
        let stream = null;
        let isStreaming = false;
        let intervalId = null;

        function getBackendUrl() {
            const ip = document.getElementById('backendIp').value.trim() || 'localhost';
            return `http://${ip}:8000`;
        }

        async function toggleStreaming() {
            const busNumber = document.getElementById('busNumber').value.trim().toUpperCase();
            if (!busNumber) {
                alert('Please enter a Bus/Cab Number first.');
                return;
            }

            const btn = document.getElementById('toggleBtn');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const video = document.getElementById('preview');

            if (isStreaming) {
                // Stop Streaming
                clearInterval(intervalId);
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                video.srcObject = null;
                isStreaming = false;
                btn.innerText = 'Start Streaming';
                btn.className = '';
                statusDot.className = 'dot';
                statusText.innerText = 'System Idle';
            } else {
                // Start Streaming
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 640, height: 480, frameRate: 15 }, 
                        audio: false 
                    });
                    video.srcObject = stream;
                    
                    isStreaming = true;
                    btn.innerText = 'Stop Streaming';
                    btn.className = 'stop';
                    statusDot.className = 'dot active';
                    statusText.innerText = 'Streaming Live: ' + busNumber;

                    // Start sending frames faster (2 FPS)
                    intervalId = setInterval(() => captureAndSend(busNumber), 500);
                } catch (err) {
                    console.error('Camera access error:', err);
                    alert('Could not access camera. Please check permissions.');
                }
            }
        }

        async function captureAndSend(busNumber) {
            const video = document.getElementById('preview');
            const canvas = document.getElementById('captureCanvas');
            const ctx = canvas.getContext('2d');
            const backendUrl = getBackendUrl();

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const base64Image = canvas.toDataURL('image/jpeg', 0.5); // Compress to 50% quality

                try {
                    const response = await fetch(`${backendUrl}/ai/analyze-frame`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            driverId: 'web-bus-' + busNumber, // Unique ID for this web stream
                            vehicleNumber: busNumber,
                            imageBase64: base64Image,
                            timestamp: new Date().toISOString()
                        })
                    });
                    
                    if (!response.ok) console.error('Upload failed:', response.status);
                } catch (err) {
                    console.error('Network error:', err);
                }
            }
        }
    </script>
</body>
</html>
